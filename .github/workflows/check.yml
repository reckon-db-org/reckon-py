# Every push and pull request: the tests on each supported Python, and a
# build of the sdist and wheel that twine accepts. A public repository, so
# GitHub-hosted runners.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -q
      - name: The installed package imports as reckon_db
        run: python -c "import reckon_db; reckon_db.connect('localhost:1', insecure=True)"

  # The structural floor (macula-codebase-checks#9): deep nesting and tangled
  # functions fail the build. The thresholds are declared in pyproject.toml's
  # [tool.ruff], with no baseline and no inline disables; ruff is pinned so a
  # preview rule cannot change between releases.
  lint:
    name: structural floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: ruff
        run: |
          python -m pip install --quiet ruff==0.17.1
          ruff check .

  # The wheel as a user gets it: built, checked, installed into a clean venv
  # at the declared dependency floors and at the latest, every stub module
  # imported from outside the repository, and the tests run against it.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        deps:
          - name: floors
            pins: 'grpcio==1.81.1 protobuf==6.33.5'
          - name: latest
            pins: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the sdist and wheel
        run: python -m pip install --upgrade build twine && python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean venv (${{ matrix.deps.name }})
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl ${{ matrix.deps.pins }} pytest
          /tmp/v/bin/pip list | grep -Ei '^(grpcio|protobuf|reckon-py) '
      - name: Every stub module imports from the installed wheel
        working-directory: /tmp
        run: |
          /tmp/v/bin/python - <<'PY'
          import importlib, pkgutil
          import reckon_db, reckon_db._proto as proto
          assert "site-packages" in reckon_db.__file__, reckon_db.__file__
          names = [m.name for m in pkgutil.iter_modules(proto.__path__)]
          assert len(names) == 20, names
          for n in names:
              importlib.import_module("reckon_db._proto." + n)
          print("imported", len(names), "stub modules from", reckon_db.__file__)
          PY
      - name: The tests against the installed wheel
        run: |
          cp -r tests /tmp/wheel-tests
          cd /tmp && /tmp/v/bin/python -m pytest -q wheel-tests -p no:cacheprovider

  # Every Python block in the README and guides type-checks against this
  # package (macula-codebase-checks#8).
  docs:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-python.yml@90ae94fdefb067d0a54da6b85950ed299cb6c1bb
