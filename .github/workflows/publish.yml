# A v* tag publishes reckon-py to PyPI. Trusted Publishing: PyPI trusts this
# workflow in this repository, in the `pypi` environment, so no token is
# stored anywhere. The pending publisher on pypi.org names exactly:
# owner reckon-db-org, repository reckon-py, workflow publish.yml,
# environment pypi.
#
# The tag must agree with the version in pyproject.toml, or nothing is
# built: a mistag must not publish a version nobody chose.
#
# The pending publisher must exist on pypi.org BEFORE the tag is pushed.
# If it does not, the publish step fails with invalid-publisher; add it and
# re-run the failed job of that same run (no re-tag).
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag agrees with pyproject.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$got" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $want, pyproject.toml says $got"
            exit 1
          fi
      - name: The tests pass on the tagged commit
        run: python -m pip install -e '.[dev]' && python -m pytest -q
      - name: Build the sdist and wheel
        run: python -m pip install --upgrade build twine && python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Every Python block in the README and guides type-checks against this
  # package (macula-codebase-checks#8): a tag whose docs no longer match does
  # not publish.
  docs:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-python.yml@90ae94fdefb067d0a54da6b85950ed299cb6c1bb

  publish:
    needs: [build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
