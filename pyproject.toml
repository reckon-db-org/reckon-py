[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reckon-py"
version = "0.1.1"
description = "Python client for ReckonDB"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/reckon-db-org/reckon-py"
Source = "https://github.com/reckon-db-org/reckon-py"

[tool.hatch.build.targets.wheel]
packages = ["src/reckon"]
