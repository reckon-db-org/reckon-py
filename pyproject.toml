[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reckon-py"
version = "0.2.0"
description = "Python client for ReckonDB"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The floors are the versions the stubs in src/reckon_db/_proto were
# generated with: they refuse any older runtime, and protobuf gencode refuses
# the next major. tests/test_dependency_floors.py keeps these honest.
dependencies = [
    "grpcio>=1.81.1",
    "protobuf>=6.33.5,<7",
]

[project.optional-dependencies]
dev = [
    # Pinned: regenerating the stubs with another grpcio-tools moves the
    # runtime floors above.
    "grpcio-tools==1.81.1",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/reckon-db-org/reckon-py"
Source = "https://github.com/reckon-db-org/reckon-py"
Changelog = "https://github.com/reckon-db-org/reckon-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/reckon-db-org/reckon-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reckon_db"]

[tool.ruff]
# The structural floor (macula-codebase-checks#9): deep nesting and tangled
# functions fail the build, with no baseline and no inline disables. Every
# threshold is spelled out, deliberately, because a tool default is not the
# floor: a default can change under us.
target-version = "py310"

[tool.ruff.lint]
select = ["C901", "PLR1702"]
# PLR1702 is a preview rule: without this line it never runs.
preview = true

[tool.ruff.lint.mccabe]
# Cyclomatic complexity, credo's measure: branch points + 1.
max-complexity = 9

[tool.ruff.lint.pylint]
# Blocks, counted as clippy counts them: the function body is 1, so 3 is
# elvis's 2.
max-nested-blocks = 3
